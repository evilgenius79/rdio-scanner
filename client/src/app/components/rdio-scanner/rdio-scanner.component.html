<mat-sidenav-container [hasBackdrop]="false">
    <mat-sidenav #searchPanel [autoFocus]="false" [disableClose]="true" position="start">
        <div class="panel search">
            <mat-toolbar>
                <div>
                    <button mat-icon-button (click)="searchPanel.close()">
                        <mat-icon>arrow_forward</mat-icon>
                    </button>
                </div>
            </mat-toolbar>
            <div #scrollableSearch>
                <div>
                    <rdio-scanner-search #searchComponent></rdio-scanner-search>
                </div>
            </div>
        </div>
    </mat-sidenav>
    <mat-sidenav #selectPanel [autoFocus]="false" [disableClose]="true" position="end">
        <div class="panel select">
            <mat-toolbar>
                <div>
                    <button mat-icon-button (click)="selectPanel.close()">
                        <mat-icon>arrow_back</mat-icon>
                    </button>
                </div>
            </mat-toolbar>
            <div #scrollableSelect>
                <div>
                    <rdio-scanner-select></rdio-scanner-select>
                </div>
            </div>
        </div>
    </mat-sidenav>
    <mat-sidenav-content>
        <rdio-scanner-main *ngIf="view === 'classic'"
            (openSearchPanel)="scrollTop(scrollableSearch); searchPanel.open(); searchComponent.searchCalls()"
            (openSelectPanel)="scrollTop(scrollableSelect); selectPanel.open();"
            (toggleFullscreen)="toggleFullscreen()">
        </rdio-scanner-main>
        <rdio-scanner-modern *ngIf="view === 'modern'"
            (switchToClassic)="setView('classic')">
        </rdio-scanner-modern>
        <!-- Floating switch-to-modern button, only visible in classic view -->
        <button *ngIf="view === 'classic'" class="view-switch-fab" type="button"
            (click)="setView('modern')"
            aria-label="Switch to modern view"
            title="Try the new modern view">
            <mat-icon>view_agenda</mat-icon>
        </button>
    </mat-sidenav-content>
</mat-sidenav-container>
