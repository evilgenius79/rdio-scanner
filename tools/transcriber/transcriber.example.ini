; Speech-to-text sidecar config. Copy to transcriber.ini (next to the
; script or /etc/transcriber.ini) and edit.

[transcriber]
; ---- Paths ----
; Directory the Uniden recorder (or any other recorder) writes WAVs into.
watch_dir = /home/scanner/scanner-calls

; Where to drop the `.txt` transcripts. Kept SEPARATE from watch_dir so
; rdio-scanner's DirWatch DeleteAfter can purge ingested WAVs without
; touching the transcripts.
transcripts_dir = /home/scanner/scanner-transcripts

; ---- Model ----
; faster-whisper model name. tiny.en / base.en / small.en / medium.en /
; large-v3. English-only variants (".en") are faster and more accurate
; on English audio. On a Pi 4 use base.en or tiny.en; medium and large
; will swap and crawl.
model = base.en

; cpu, cuda, auto. Pi has no GPU, so cpu.
device = cpu

; int8 is small, fast, and basically as accurate as float16 for short
; speech-radio audio. Use float32 only if you suspect quantization
; quality issues.
compute_type = int8

; Force language to skip auto-detect (faster and more reliable on short
; clips). Leave blank to auto-detect.
language = en

; ---- Tuning ----
poll_seconds = 5

; Skip WAVs shorter than this many seconds. Squelch noise blips often
; come through as <0.5s "calls" that produce garbage transcripts.
min_wav_seconds = 0.5

; Whisper greedy decode (beam_size=1) is plenty for short utterances and
; cuts CPU roughly in half compared to beam_size=5. Bump up if you
; consistently see truncated transcripts.
beam_size = 1

; Threshold above which a segment is judged silent and dropped. 0.6 is
; default; raise toward 0.8 to filter out more "is anyone there"
; hallucinations; lower if real speech is getting dropped.
no_speech_threshold = 0.6

; ---- Vocabulary hint ----
; Whisper accepts an "initial prompt" that biases decoding toward your
; domain's vocabulary. List your local 10-codes, common signal callsigns,
; agency names, and a few street/town names. The prompt itself is NOT
; transcribed; it's only used as a hint.
;
; Examples (uncomment and edit):
;
;initial_prompt = Police and fire dispatch radio. Codes: 10-4, 10-50, 10-99, signal 12. Streets: Main, Elm, Oak. Towns: Rushville, Greensburg, Shelbyville. Units: 51, 52, 99 Adam.
